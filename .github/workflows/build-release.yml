name: Build Release

on:
  push:
    paths-ignore:
      - '**/*.tgz'
      - '**/*.gz'
      - '**/dist/**'
      - '**/release*/**'
      - '**/_auto*/**'
      - '**/.husky/**'
      - '**/garbage-collector/**'
      - '**/codeql/**'
      - '.github/workflows/tester.yml'
      - '**/*.log'
      - '**/*.txt'
      - '**/*.zip'
      - '**/test*'
      - '**/docs/**'
  workflow_dispatch:

concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: build release
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_OPTIONS: --max_old_space_size=8192
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      YARN_CHECKSUM_BEHAVIOR: update
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: 🔑 Configure git credentials for GitLab
        run: git config --global url."https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "https://gitlab.com/"

      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: ⚙️ Setup Node + Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Install dependencies
        run: |
          corepack enable
          touch yarn.lock
          yarn install

      - name: 🧹 Clean
        run: yarn run clean

      - name: 🔨 Build
        run: yarn run build

      - name: 📦 Pack
        run: yarn run pack

      - name: ✅ Verify compiled output
        run: |
          node test/test-compiled.cjs
          yarn jest --runInBand --forceExit --testTimeout=120000 --detectOpenHandles --testPathPatterns=validate-tarball-yarn.test.cjs
          yarn jest --runInBand --forceExit --testTimeout=120000 --detectOpenHandles --testPathPatterns=validate-tarball-npm.test.cjs

      - name: '🗑️ Remove packageManager from package.json'
        shell: bash
        run: |
          # Remove packageManager from package.json if it exists
          # Prefer jq if available, otherwise use Node.js (cross-platform)
          if command -v jq >/dev/null 2>&1; then
            jq 'del(.packageManager)' package.json > temp.json && mv temp.json package.json
            # Ensure package.json ends with a single empty line
            awk 'NR==1{print $0} NR>1{print $0} END{print ""}' package.json > temp.json && mv temp.json package.json
          else
            node -e "let f='package.json';let j=require('./'+f);delete j.packageManager;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n');"
          fi

      # https://github.com/marketplace/actions/verify-changed-files
      - name: '🕵️‍♂️ Check for changes in build artifacts'
        id: changes
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            release*/**/*.tgz
            dist
            lib
            !node_modules
            !tmp

      - shell: bash
        name: '📋 Show changed files'
        run: |
          echo "Changed files: ${{ steps.changes.outputs.changed_files }}"

      - name: '➕ Add build files to git'
        if: steps.changes.outputs.files_changed == 'true'
        continue-on-error: true
        run: |
          git config set advice.addIgnoredFile false
          git add release || true
          git add releases || true
          git add dist || true
          git add lib || true

      - name: 🚀 Commit & push changed release tarballs
        if: steps.changes.outputs.files_changed == 'true'
        run: |
          # detach submodules so lint-staged/husky don't choke
          find . -maxdepth 2 -name '.git' -not -path './.git' -type f -delete

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # abort if any staged file exceeds 30MB
          for file in $(git diff --cached --name-only); do
            size_mb=$(( $(stat -c%s "$file") / 1024 / 1024 ))
            echo "${size_mb}MB $file"
            if [ "$size_mb" -gt 30 ]; then
              echo "Error: $file exceeds 30MB. Aborting push."
              exit 1
            fi
          done

          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUNNER_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git commit -m "chore: update build from $COMMIT_URL" \
                     -m "commit hash: ${GITHUB_SHA::7}" \
                     -m "commit url: $COMMIT_URL" \
                     -m "runner: $RUNNER_URL"
          git push
