# This workflow builds and packs the package

name: Node.js Package Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - "**/*.tgz"
      - "**/release*"
      - ".github/workflows/clean-caches.yml"

jobs:
  build:
    if: ${{ !contains(join(github.event.commits.*.added, ' '), '.tgz') && !contains(join(github.event.commits.*.modified, ' '), '.tgz') && !contains(join(github.event.commits.*.removed, ' '), '.tgz') }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout main repository
        uses: actions/checkout@v6
        with:
          ref: master
          token: "${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"

      - name: ⬇️ Checkout test-repo
        uses: actions/checkout@v6
        with:
          repository: dimaslanjaka/test-repo
          path: tmp/test-repo
          token: "${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"
          ref: test

      - name: ⬇️ Checkout packages/git-command-helper
        uses: actions/checkout@v6
        with:
          repository: dimaslanjaka/git-command-helper
          path: packages/git-command-helper
          token: "${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"
          ref: pre-release

      - name: ⬇️ Checkout packages/cross-spawn
        uses: actions/checkout@v6
        with:
          repository: dimaslanjaka/node-cross-spawn
          path: packages/cross-spawn
          token: "${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}"
          ref: private

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 🐍 Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          # Install requirements if available
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - uses: actions/cache@v5
        id: cache
        name: 📚 Init cache
        with:
          path: |
            **/.yarn
            **/yarn.lock
            **/node_modules
            **/.venv
            **/venv
            **/__pycache__
            **/*.pyc
            **/tmp/**
            **/*.bak
            **/test-project
            **/dist
          key: ${{ runner.os }}-${{ hashFiles('**/package.json', '**/requirements*.txt', '.github') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('**/package.json', '**/requirements*.txt', '.github') }}
            ${{ runner.os }}-

      - name: Add custom bins to PATH
        shell: bash
        run: |
          BIN_DIRS=(
            "${{ github.workspace }}/node_modules/.bin"
            "${{ github.workspace }}/vendor/bin"
            "${{ github.workspace }}/.venv/bin"
            "${{ github.workspace }}/venv/bin"
            "${{ github.workspace }}/bin"
            "${{ github.workspace }}/binaries"
          )

          for dir in "${BIN_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"

              # Fix permissions
              chmod -R +x "$dir"

              echo "Added: $dir"
            else
              echo "Skipped missing dir: $dir"
            fi
          done

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🧹 Clean project
        run: npm run clean

      - name: 🛠️ Build project
        run: npm run build

      - name: 📦 Pack project
        run: npm run pack

      - name: 🚀 Push tarball changes
        if: ${{ success() && !contains(github.event.head_commit.message, 'update build from CI') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases

          # Check if there are staged changes in releases/
          if [ "$(git status --porcelain releases | wc -l)" -gt "0" ]; then
            # Get current commit hash (the tarball commit)
            CURRENT_COMMIT_HASH=$(git rev-parse HEAD)

            # Get the previous commit hash that touched src/ (excluding the current one)
            SRC_COMMIT_HASH=$(git log --pretty=format:"%h" src | grep -v "$CURRENT_COMMIT_HASH" | head -n 1)

            # If no matching commit found, exit safely
            if [ -z "$SRC_COMMIT_HASH" ]; then
              echo "❌ No previous commit found in 'src/' before the current tarball commit."
              exit 1
            fi

            # Amend the current commit message to include the src commit reference
            NEW_MESSAGE="chore(tarball): update tarball artifacts from CI build based on src at $SRC_COMMIT_HASH"
            git commit -m "$NEW_MESSAGE"
            git push
          else
            echo "✅ No changes to release. Skipping push."
          fi
