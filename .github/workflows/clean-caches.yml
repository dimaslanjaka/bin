name: Clean GitHub Actions Cache

on:
  workflow_run:
    workflows:
      - Node.js Package Build
      - Node.js Package Test
    types:
      - completed

  workflow_dispatch:

  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

concurrency:
  group: clean-cache
  cancel-in-progress: true

jobs:
  clean-cache:
    # if: contains(github.repository, 'php-proxy-hunter')
    runs-on: windows-latest

    env:
      PIP_CACHE_DIR: "${{ github.workspace }}/project/tmp/pip"
      NUITKA_CACHE_DIR: "${{ github.workspace }}/project/tmp/nuitka-cache"
      NODE_OPTIONS: "--max_old_space_size=4096"
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      YARN_CHECKSUM_BEHAVIOR: update

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          # repository: "dimaslanjaka/php-proxy-hunter"
          # ref: master
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          # lfs: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: 📦 Get pip Cache Directory
        id: pip-cache
        run: echo "pip_cache_dir=$(pip cache dir)" >> $GITHUB_ENV

      - name: 🗄️ Setup Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ./dist/
            ./tmp/
            src/*.sqlite*
            src/*.mmdb
            node_modules/
            .yarn/caches/
            .yarn/*.gz
            ./venv/
            ${{ env.pip_cache_dir }}
            ${{ env.NUITKA_CACHE_DIR }}
            **/*.lock
            **/*.txt
            **/package-lock.json
            assets/proxies/
            vendor/
            ${{ env.USERPROFILE }}\AppData\Local\Nuitka\Nuitka/Cache
            $HOME/AppData/Local/Nuitka/Nuitka/Cache
            config/
            .cache/
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json', '**/requirements*.txt', '.github') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package.json', '**/requirements*.txt', '.github') }}
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - name: 🔄 Update Submodules
        run: |
          echo "init submodules"
          git submodule init
          git submodule foreach "git submodule init"

          echo "sync submodules"
          git submodule sync
          git submodule foreach "git submodule sync"

          echo "update submodules"
          npx -y rimraf .git/modules
          npx -y binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz submodule-install
        shell: bash

      - name: 📥 Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          corepack enable
          yarn install

      - name: 🏗️ Build Project
        run: |
          yarn build

      - name: 🧹 Clean GitHub Actions Cache ${{ github.event.workflow_run.head_sha }}
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node lib/clean-github-actions-caches-cli.cjs
        shell: bash
