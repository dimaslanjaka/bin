name: Deploy Docs

on:
  push:
    paths:
      - docs-src/**/*.md
      - mkdocs.yml
      - hooks/**/*.py
      - readme.md

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v6

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: '⚙️ Configure Pages'
        uses: actions/configure-pages@v6

      - name: '🐍 Setup Python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: '📦 Setup Cache'
        uses: actions/cache@v5
        with:
          path: |
            docs
            site
            node_modules
          key: ${{ runner.os }}-docs-${{ hashFiles('docs-src/**', 'mkdocs.yml', 'hooks/**', '[Rr][Ee]adme.md') }}
          restore-keys: |
            ${{ runner.os }}-docs-

      - name: '📥 Install Dependencies'
        shell: bash
        run: |
          pip install mkdocs-material markdown-it-py

      - name: '⚙️ Pre-Process Docs'
        shell: bash
        run: |
          # Pre-process docs in-place before mkdocs validates nav
          python3 hooks/pre-generate-docs.py

      - name: '🔨 Generate Site'
        shell: bash
        run: |
          mkdocs build

      - name: '📤 Upload Pages Artifact'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: '🚀 Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v5
