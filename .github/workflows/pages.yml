name: Deploy Docs

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.tgz'
      - '**/release*/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            docs
            site
            node_modules
          key: ${{ runner.os }}-docs-${{ hashFiles('docs-src/**', 'mkdocs.yml', 'hooks/**', '[Rr][Ee]adme.md') }}
          restore-keys: |
            ${{ runner.os }}-docs-

      - name: Install Dependencies
        shell: bash
        run: |
          pip install mkdocs-material markdown-it-py

      - name: Pre-Process Docs
        shell: bash
        run: |
          # Pre-process docs in-place before mkdocs validates nav
          python3 hooks/pre-process-docs.py

      - name: Generate Site
        shell: bash
        run: |
          mkdocs build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
