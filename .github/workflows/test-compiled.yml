name: Test Compiled Output
concurrency:
  group: test-compiled-${{ github.event.workflow_run.head_branch || github.event_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Release']
    types: [completed]

env:
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
  GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}

jobs:
  test-compiled:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 19, 20, 21, 22, 23, 24]

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true

      - name: ⬇️ Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: '🔑 Hash source files for cache key'
        uses: seepine/hash-files@v1
        id: get-hash
        with:
          gitignore: true
          ignoreFiles: |
            !**/node_modules
            !**/packages
          patterns: |
            package.json
            test/test-compiled.cjs
            **/*build*
            **/*rollup*
            **/*tsconfig*
            requirements.txt

      - name: 🗃️ Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules/**
          key: ${{ runner.os }}-test-${{ steps.get-hash.outputs.hash }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: 📥 Install dependencies
        shell: bash
        run: |
          touch yarn.lock
          corepack enable
          corepack yarn install

      - name: ✅ Verify compiled output
        run: node test/test-compiled.cjs
