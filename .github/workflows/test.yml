name: Node.js Package Test
concurrency:
  group: test
  cancel-in-progress: true
on:
  workflow_run:
    workflows:
      - Build Release
    types:
      - completed
  workflow_dispatch: {}
  push:
    paths:
      - '**/test*/**'
      - '**/test*'
      - '**/src/**'
env:
  CI_NODE_VERSION: 24.16.0
  CI_PYTHON_VERSION: '3.11'
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
  GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
jobs:
  ci:
    name: 🔨 Build, Pack & Test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion
      == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout workflow repository
        uses: actions/checkout@v6
      - name: ⬇️ Setup CI Environment
        uses: ./.github/actions/setup-environments
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          python-version: ${{ env.CI_PYTHON_VERSION }}
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          prefix-cache-key: ${{ runner.os }}-test-
      - name: 📦 Install dependencies
        run: |-
          touch yarn.lock
          corepack yarn install
      - name: 🔨 Build project
        run: corepack yarn build
      - name: 📦 Pack project
        run: corepack yarn pack
      - name: 🧹 Clean GitHub Actions Cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        shell: bash
        run: |-
          SHA="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          npx --legacy-peer-deps -y   binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz   clean-github-actions-caches   --repo "${{ github.repository }}"   --sha "$SHA"
      - name: 🧪 Run tests in test/clean-github-actions-caches.test.cjs
        id: run-test-clean-github-actions-caches-test-cjs
        shell: bash
        run: >-
          if [ -f "test/clean-github-actions-caches.test.cjs" ]; then
            bash bin/test-cjs --testPathPatterns="clean-github-actions-caches.test.cjs"
          else
            echo "Skipping missing test file: test/clean-github-actions-caches.test.cjs"
          fi
      - name: 🧪 Run tests in test/filemanager/rmpath.test.mjs
        id: run-test-filemanager-rmpath-test-mjs
        shell: bash
        run: |-
          if [ -f "test/filemanager/rmpath.test.mjs" ]; then
            bash bin/test-esm --testPathPatterns="rmpath.test.mjs"
          else
            echo "Skipping missing test file: test/filemanager/rmpath.test.mjs"
          fi
      - name: 🧪 Run tests in test/find-node-modules.test.ts
        id: run-test-find-node-modules-test-ts
        shell: bash
        run: >-
          if [ -f "test/find-node-modules.test.ts" ]; then
            node node_modules/jest/bin/jest.js --runInBand --forceExit --testTimeout=120000 --detectOpenHandles --testPathPatterns="find-node-modules.test.ts"
          else
            echo "Skipping missing test file: test/find-node-modules.test.ts"
          fi
      - name: 🧪 Run tests in test/getFileTreeString.test.cjs
        id: run-test-getFileTreeString-test-cjs
