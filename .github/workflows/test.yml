name: Node.js Package Test

concurrency:
  group: test-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - Build Release
    types:
      - completed

  workflow_dispatch:

  push:
    paths:
      - '**/test*/**'
      - '**/test*'
      - '**/src/**'

env:
  CI_NODE_VERSION: '24.x'
  CI_PYTHON_VERSION: '3.11'

jobs:
  build:
    name: 🔨 Build & Pack
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout workflow repository
        uses: actions/checkout@v6
      - name: ⬇️ Checkout dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: 📚 Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            **/.yarn
            **/node_modules
            **/.venv
            **/venv
            **/__pycache__
            **/*.pyc
            .cache
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package.json', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: 🐍 Create virtual environment
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Add custom bins to PATH
        shell: bash
        run: |
          BIN_DIRS=(
            "${{ github.workspace }}/node_modules/.bin"
            "${{ github.workspace }}/vendor/bin"
            "${{ github.workspace }}/.venv/bin"
            "${{ github.workspace }}/venv/bin"
            "${{ github.workspace }}/bin"
            "${{ github.workspace }}/binaries"
          )

          for dir in "${BIN_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              chmod -R +x "$dir" || true
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔨 Build project
        run: yarn build

      - name: 📦 Pack project
        run: yarn pack

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          compression-level: 0
          path: |
            dist/**
            releases/**
            *.tgz
            packages/**/dist/**
            packages/**/*.tgz

  test:
    name: 🧪 Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout workflow repository
        uses: actions/checkout@v6
      - name: ⬇️ Checkout dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: 📚 Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            **/.yarn
            **/node_modules
            **/.venv
            **/venv
            **/__pycache__
            **/*.pyc
            .cache
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package.json', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Add custom bins to PATH
        shell: bash
        run: |
          BIN_DIRS=(
            "${{ github.workspace }}/node_modules/.bin"
            "${{ github.workspace }}/vendor/bin"
            "${{ github.workspace }}/.venv/bin"
            "${{ github.workspace }}/venv/bin"
            "${{ github.workspace }}/bin"
            "${{ github.workspace }}/binaries"
          )

          for dir in "${BIN_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              chmod -R +x "$dir" || true
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done

      - name: 🧪 Run CJS tests
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: |
          bash bin/test-cjs \
            --coverage=true \
            --detectOpenHandles \
            --testPathPatterns="${{ github.workspace }}/test/"

      - name: 🧪 Run ESM tests
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: |
          bash bin/test-esm \
            --coverage=true \
            --detectOpenHandles \
            --testPathPatterns="${{ github.workspace }}/test/"

  cleanup:
    name: 🧹 Clean GitHub Actions Cache
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 🧹 Clean GitHub Actions Cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        shell: bash
        run: |
          SHA="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          npx --legacy-peer-deps -y \
            binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz \
            clean-github-actions-caches \
            --repo "${{ github.repository }}" \
            --sha "$SHA"
